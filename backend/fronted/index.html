<!DOCTYPE html>
<html>
<head>
<title>DealDhamaka - Har Click Pe Dhamaka!</title>
<style>
body{font-family:Arial;background:#f5f5f5;margin:0;padding:20px}
h1{color:#ff4757;text-align:center}
.product{background:white;padding:15px;margin:10px;border-radius:10px;box-shadow:0 2px 5px rgba(0,0,0,0.1);display:inline-block;width:200px}
.product img{width:100%;height:150px;object-fit:cover;border-radius:5px}
button{background:#ff4757;color:white;border:none;padding:10px 20px;border-radius:5px;cursor:pointer}
button:hover{background:#ff3838}
</style>
</head>
<body>
<h1>🔥 DealDhamaka - Har Click Pe Dhamaka! 🔥</h1>
<p style="text-align:center;color:gray">Jitni socho, utni bachat</p>

<div id="products"></div>

<script>
fetch('http://localhost:5000/api/products')
.then(res=>res.json())
.then(data=>{
  let html = '';
  data.forEach(p=>{
    html += `
    <div class="product">
      <img src="${p.image}">
      <h3>${p.name}</h3>
      <p><b>₹${p.price}</b></p>
      <button>Cart Mein Daalo</button>
    </div>`;
  });
  document.getElementById('products').innerHTML = html;
});
</script>
</body>
</html>
